name: Deploy To Staging

on: 
  push: 
    branches:
      - staging

jobs: 
  create-deployments-artifacts: 
    name: Create deployments artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure PHP 8.1
        uses: shivammathur/setup-php@master
        with: 
          php-version: 8.1
          extensions: mbstring, ctype, fileinfo, openssl, PDO, bcmath, json, tokenizer, xml

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Configure Laravel main .env
        run: |
          echo "${{ vars.STAGING_ADMIN_LARAVEL_ENV }}" > .env

      - name: Create deployment artifact
        run: shopt -s dotglob && tar -zcvf admin-application.tar.gz --exclude=storage --exclude=public/graph/uploads --exclude=.git --exclude=node_modules *

      - name: Store artifact for destribution
        uses: actions/upload-artifact@v4
        with: 
          name: app-build
          path: admin-application.tar.gz
          
  prepare-release-on-server: 
    name: Prepare release on server
    runs-on: ubuntu-latest
    needs: create-deployments-artifacts
    steps: 
      - uses: actions/download-artifact@v4
        with: 
          name: app-build

      - name: Upload
        uses: appleboy/scp-action@master
        with: 
          host: ${{ vars.STAGING_ADMIN_DOMAIN }}
          username: ${{ vars.STAGING_ADMIN_USERNAME }}
          password: ${{ vars.STAGING_ADMIN_PASSWORD }}
          port: ${{ vars.STAGING_ADMIN_PORT }}
          source: admin-application.tar.gz
          target: deployments/artifacts/staging

      - name: Extract archive and create directories
        uses: garygrossgarten/github-action-ssh@release
        with: 
          host: ${{ vars.STAGING_ADMIN_DOMAIN }}
          username: ${{ vars.STAGING_ADMIN_USERNAME }}
          password: ${{ vars.STAGING_ADMIN_PASSWORD }}
          port: ${{ vars.STAGING_ADMIN_PORT }}
          command: |
            mkdir -p deployments/releases/admin-staging
            find ~/deployments/releases/admin-staging -type d -exec chmod 755 {} \;
            find ~/deployments/releases/admin-staging -type f -exec chmod 644 {} \;
            rm -rf deployments/releases/admin-staging/vendor
            cd deployments/releases/admin-staging && git clean --force
            cd ~
            tar xzf deployments/artifacts/staging/admin-application.tar.gz -C "deployments/releases/admin-staging"
            rm -f deployments/artifacts/staging/admin-application.tar.gz
            mkdir -p deployments/releases/admin-staging/storage/{app,framework,logs}
            mkdir -p deployments/releases/admin-staging/storage/app/public
            mkdir -p deployments/releases/admin-staging/storage/framework/{cache,sessions,testing,views}
            mkdir -p deployments/releases/admin-staging/storage/framework/cache/data
  
  activate-release: 
    name: Activate release
    runs-on: ubuntu-latest
    needs: [ create-deployments-artifacts, prepare-release-on-server ]
    steps:
      - name: Activating release
        uses: garygrossgarten/github-action-ssh@release
        env: 
          LARAVEL_ENV: ${{ vars.STAGING_ADMIN_LARAVEL_ENV }}
        with: 
          host: ${{ vars.STAGING_ADMIN_DOMAIN }}
          username: ${{ vars.STAGING_ADMIN_USERNAME }}
          password: ${{ vars.STAGING_ADMIN_PASSWORD }}
          port: ${{ vars.STAGING_ADMIN_PORT }}
          command: |
            rm ~/public_html/admin-staging
            ln -s ~/deployments/releases/admin-staging/public ~/public_html/admin-staging
            rm -f ~/deployments/releases/admin-staging/public/graph/uploads/.htaccess
            cp ~/deployments/releases/admin-staging/.github/workflows/htaccesses/prevent-file-execution.htaccess ~/deployments/releases/admin-staging/public/graph/uploads/.htaccess
            cd ~/deployments/releases/admin-staging
            /usr/local/bin/ea-php81 artisan migrate
            /usr/local/bin/ea-php81 artisan db:seed
            /usr/local/bin/ea-php81 artisan module:seed
            cd ~
